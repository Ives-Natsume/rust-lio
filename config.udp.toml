# Configuration for UDP Mode (ROS Bag Replay)
# 使用Python脚本将ROS bag转换为UDP流

log_level = "info"

[lidar]
# 使用UDP模式接收数据
data_source = "Udp"
frame_time = 100  # 100ms = 10Hz (与bag文件中的LiDAR频率匹配)

# UDP监听地址（与Python脚本发送目标对应）
lidar_bind_addr = "0.0.0.0:56301"
imu_bind_addr = "0.0.0.0:56401"

# 点云边界设置
max_boundary = 50.0  # 较大的场景

# Dataset settings (not used in UDP mode)
dataset_path = "reference/dataset/park"
dataset_fps = 10.0

[ikd_tree]
delete_criterion_param = 0.5
balance_criterion_param = 0.6
downsample_size = 0.1
