syntax = "proto3";

package slam;

message PointXYZI {
    float x = 1;
    float y = 2;
    float z = 3;
    float intensity = 4;
}

message PointCloudXYZI {
    uint64 timestamp = 1;
    repeated PointXYZI points = 2;
}

// IMU data structure
// Currently empty, to be defined later
message ImuData {

}

message SensorPacket {
    oneof data {
        PointCloudXYZI point_cloud = 1;
        ImuData imu_data = 2;
    }
}