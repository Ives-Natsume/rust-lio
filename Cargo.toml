[package]
name = "rust-lio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
byteorder = "1.5.0"
bytes = "1.11.0"
config = "0.15.19"
flume = "0.12.0"
nalgebra = "0.34.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sophus = "0.15.0"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
